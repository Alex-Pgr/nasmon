name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Check installer syntax
        run: bash -n install.sh

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Run race detector
        run: go test -race ./...

      - name: Build nasmon
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags='-s -w' -o nasmon ./cmd/nasmon

      - name: Build nasmond
        env:
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags='-s -w' -o nasmond ./cmd/nasmond
